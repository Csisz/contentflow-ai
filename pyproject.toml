[project]
name = "contentflow-ai"
version = "0.1.0"
description = "ContentFlow AI - On-prem OCR Intake + Content Server Migration Copilot"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.0",
  "requests>=2.31.0",
  "Flask>=3.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
contentflow = "contentflow_ai.migration.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
